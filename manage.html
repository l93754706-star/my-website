<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>更新网站 HTML</title>
<style>
  :root{--fg:#181818;--muted:#7a7a76;--line:#e4e3df;--bg:#f5f5f3;--card:#fff;--accent:#2f6b4f}
  *{box-sizing:border-box}
  body{margin:0;padding:24px 18px 48px;background:var(--bg);color:var(--fg);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
  main{max-width:520px;margin:0 auto}
  h1{font-size:20px;margin:0 0 6px}
  p.sub{color:var(--muted);font-size:12.5px;margin:0 0 20px}
  section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
  input[type=text],input[type=password],input[type=file]{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:12px;background:var(--bg);color:var(--fg);font:inherit}
  button{width:100%;padding:13px;border:0;border-radius:14px;background:var(--accent);color:#fff;
    font:inherit;font-weight:600;margin-top:14px}
  button[disabled]{opacity:.5}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:400}
  pre{white-space:pre-wrap;word-break:break-all;font-size:12px;margin:12px 0 0;color:var(--muted)}
  .ok{color:#2f6b4f}.bad{color:#b3261e}
</style>
</head>
<body>
<main>
  <h1>更新网站 HTML</h1>
  <p class="sub">把打包好的 zip 或单个 index.html 发布成新的静态版本。令牌只保存在这台设备。</p>

  <section>
    <label for="site">站点 ID</label>
    <input id="site" type="text" inputmode="text" autocomplete="off"
           placeholder="在 Netlify 项目设置里的 Project ID">
    <label for="token">Netlify 访问令牌</label>
    <input id="token" type="password" autocomplete="off" placeholder="只保存在本机浏览器">
    <button class="ghost" id="forget" type="button">清除本机保存的令牌</button>
  </section>

  <section>
    <label for="file">选择文件（.zip 或 .html）</label>
    <input id="file" type="file" accept=".zip,.html,application/zip,text/html">
    <button id="deploy" type="button">上传并发布</button>
    <pre id="log"></pre>
  </section>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'mono-netlify-deploy';
const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } })();
if (saved.site) $('site').value = saved.site;
if (saved.token) $('token').value = saved.token;

const log = (text, cls = '') => { const el = $('log'); el.className = cls; el.textContent = text; };

// 极简 zip 打包：只存不压缩，够发布单个 HTML 用
const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    table[i] = c >>> 0;
  }
  return table;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (const b of bytes) c = CRC_TABLE[(c ^ b) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function singleFileZip(name, data) {
  const enc = new TextEncoder();
  const nameBytes = enc.encode(name);
  const body = new Uint8Array(data);
  const crc = crc32(body);
  const local = new Uint8Array(30 + nameBytes.length);
  const lv = new DataView(local.buffer);
  lv.setUint32(0, 0x04034b50, true);
  lv.setUint16(4, 20, true);
  lv.setUint16(8, 0, true);              // 存储
  lv.setUint32(14, crc, true);
  lv.setUint32(18, body.length, true);
  lv.setUint32(22, body.length, true);
  lv.setUint16(26, nameBytes.length, true);
  local.set(nameBytes, 30);

  const central = new Uint8Array(46 + nameBytes.length);
  const cv = new DataView(central.buffer);
  cv.setUint32(0, 0x02014b50, true);
  cv.setUint16(4, 20, true);
  cv.setUint16(6, 20, true);
  cv.setUint16(10, 0, true);
  cv.setUint32(16, crc, true);
  cv.setUint32(20, body.length, true);
  cv.setUint32(24, body.length, true);
  cv.setUint16(28, nameBytes.length, true);
  cv.setUint32(42, 0, true);
  central.set(nameBytes, 46);

  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, 1, true);
  ev.setUint16(10, 1, true);
  ev.setUint32(12, central.length, true);
  ev.setUint32(16, local.length + body.length, true);

  const out = new Uint8Array(local.length + body.length + central.length + end.length);
  let at = 0;
  for (const part of [local, body, central, end]) { out.set(part, at); at += part.length; }
  return out;
}

async function deploy() {
  const site = $('site').value.trim();
  const token = $('token').value.trim();
  const file = $('file').files[0];
  if (!site || !token) return log('请先填写站点 ID 和令牌。', 'bad');
  if (!file) return log('请选择 zip 或 index.html。', 'bad');
  localStorage.setItem(KEY, JSON.stringify({ site, token }));
  $('deploy').disabled = true;
  log('正在打包上传…');
  try {
    let zip;
    if (/\.html?$/i.test(file.name)) {
      zip = singleFileZip('index.html', await file.arrayBuffer());
    } else {
      zip = new Uint8Array(await file.arrayBuffer());
    }
    log(`正在上传 ${(zip.length / 1024).toFixed(0)} KB…`);
    const response = await fetch(`https://api.netlify.com/api/v1/sites/${encodeURIComponent(site)}/deploys`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/zip' },
      body: zip
    });
    const text = await response.text();
    if (!response.ok) return log('上传失败：HTTP ' + response.status + '\n' + text.slice(0, 300), 'bad');
    let data = {};
    try { data = JSON.parse(text); } catch {}
    log('已提交部署。\n部署编号：' + (data.id || '未知') + '\n状态：' + (data.state || '处理中') +
      '\n\n等十几秒后打开网站即可。', 'ok');
  } catch (error) {
    log('出错：' + (error.message || error), 'bad');
  } finally {
    $('deploy').disabled = false;
  }
}

$('deploy').addEventListener('click', deploy);
$('forget').addEventListener('click', () => {
  localStorage.removeItem(KEY);
  $('token').value = '';
  log('已清除本机保存的令牌。');
});
</script>
</body>
</html>
