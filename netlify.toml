[build]
  command = "node build.cjs"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["assets/default.html"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/site/:splat"
  status = 200
  force = true
